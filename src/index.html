<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点配置生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            margin-top: 30px;
        }
        .form-control {
            font-family: monospace;
        }
        .example-text {
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>节点配置生成器</h2>
        <form id="nodeForm" class="mt-4">
            <div class="mb-3">
                <label class="form-label">节点链接（每行一个）</label>
                <textarea class="form-control" id="nodeLinks" rows="10" placeholder="支持以下格式：
1. vless://uuid@host:port?type=tcp&security=reality&...
2. host:port:username:password"></textarea>
            </div>
            <div class="mb-3">
                <div class="example-text">
                    <strong>示例格式：</strong><br>
                    vless://749f218f-e3a2-439e-9519-97e023a45eab@154.17.234.77:10555?type=tcp&security=reality&pbk=6f4MCXgzaep4XsQYpY2eZHqqbpLDlWqiO1_wjE1bsV4&fp=chrome&sni=yahoo.com&sid=ab6d&spx=%2F&flow=xtls-rprx-vision#temptest<br>
                    45.192.39.149:63301:DdtUSM7A:4MaSifWk
                </div>
            </div>
            <button type="submit" class="btn btn-primary">生成配置</button>
        </form>
    </div>

    <script>
        document.getElementById('nodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nodeLinks = document.getElementById('nodeLinks').value;
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nodes: nodeLinks.split('\n').filter(n => n.trim()) })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'config.yaml';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('生成配置文件失败');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('发生错误');
            }
        });
    </script>
</body>
</html>
