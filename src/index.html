<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点配置生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin-top: 30px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            color: #0d6efd;
        }
        .form-control {
            font-family: monospace;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,.15);
        }
        .node-types {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }
        .node-type-badge {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .example-box {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .config-preview {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>NodeConfig</h1>
            <p class="text-muted">节点配置生成工具</p>
        </div>
        
        <form id="nodeForm">
            <div class="node-types">
                <h5>支持的节点类型：</h5>
                <span class="node-type-badge bg-primary">VLESS</span>
                <span class="node-type-badge bg-success">SOCKS5</span>
            </div>

            <div class="mb-3">
                <label class="form-label">节点链接</label>
                <textarea 
                    class="form-control" 
                    id="nodeLinks" 
                    rows="10" 
                    placeholder="请输入节点链接，支持以下格式：
1. VLESS: vless://uuid@host:port?参数...
2. SOCKS5: host:port:username:password

多个节点可以：
- 每行一个节点
- 使用英文分号(;)分隔"></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-primary" onclick="checkConfig()">
                    <i class="bi bi-check-circle"></i> 检查格式
                </button>
                <button type="button" class="btn btn-success" onclick="generateAndDownload()">
                    <i class="bi bi-download"></i> 下载配置
                </button>
            </div>
        </form>

        <div id="statusMessage" class="status-message" style="display: none;"></div>
        
        <div id="configPreview" class="config-preview" style="display: none;">
            <h5>配置预览：</h5>
            <pre id="yamlContent"></pre>
        </div>
    </div>

    <script>
        async function checkConfig() {
            const nodeLinks = document.getElementById('nodeLinks').value;
            const nodes = nodeLinks.split(/[\n;]/).filter(n => n.trim());
            
            if (nodes.length === 0) {
                showError('请输入至少一个节点链接');
                return;
            }

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nodes })
                });

                const result = await response.json();
                const statusDiv = document.getElementById('statusMessage');
                const previewDiv = document.getElementById('configPreview');
                
                if (response.ok) {
                    statusDiv.className = 'status-message status-success';
                    statusDiv.innerHTML = '✓ 配置格式正确';
                    document.getElementById('yamlContent').textContent = result.yaml;
                    previewDiv.style.display = 'block';
                } else {
                    statusDiv.className = 'status-message status-error';
                    statusDiv.innerHTML = '✗ ' + result.message;
                    previewDiv.style.display = 'none';
                }
                statusDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                showError('检查格式时发生错误');
            }
        }

        async function generateAndDownload() {
            const nodeLinks = document.getElementById('nodeLinks').value;
            const nodes = nodeLinks.split(/[\n;]/).filter(n => n.trim());
            
            if (nodes.length === 0) {
                showError('请输入至少一个节点链接');
                return;
            }

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nodes })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'config.yaml';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    const statusDiv = document.getElementById('statusMessage');
                    statusDiv.className = 'status-message status-success';
                    statusDiv.innerHTML = '✓ 配置文件已下载';
                    statusDiv.style.display = 'block';
                } else {
                    const error = await response.json();
                    showError(error.message || '生成配置文件失败');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('生成配置文件时发生错误');
            }
        }

        function showError(message) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = 'status-message status-error';
            statusDiv.innerHTML = '✗ ' + message;
            statusDiv.style.display = 'block';
            
            // 隐藏预览
            document.getElementById('configPreview').style.display = 'none';
        }
    </script>
</body>
</html>
