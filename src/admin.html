<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeConfig 管理面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
            background-color: #343a40;
        }
        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: .5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .nav-link {
            color: #fff;
            padding: 10px 20px;
        }
        .nav-link:hover {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .nav-link.active {
            background-color: #0d6efd;
        }
        .main-content {
            margin-left: 240px;
            padding: 20px;
        }
        .card {
            margin-bottom: 20px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .stats-card {
            background: linear-gradient(45deg, #0d6efd, #0a58ca);
            color: white;
        }
        .table-responsive {
            background-color: white;
            border-radius: 0.25rem;
            padding: 15px;
        }
        .action-buttons .btn {
            margin: 0 2px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .pagination {
            margin-top: 20px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div class="sidebar-sticky">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="#dashboard">
                        <i class="bi bi-speedometer2"></i> 仪表盘
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#subscriptions">
                        <i class="bi bi-list-ul"></i> 订阅管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#nodes">
                        <i class="bi bi-diagram-3"></i> 节点管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#users">
                        <i class="bi bi-people"></i> 用户管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#logs">
                        <i class="bi bi-journal-text"></i> 操作日志
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#settings">
                        <i class="bi bi-gear"></i> 系统设置
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div id="dashboard" class="container-fluid">
            <h2 class="mb-4">仪表盘</h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="card stats-card">
                        <div class="card-body">
                            <h5 class="card-title">总订阅数</h5>
                            <h3 class="card-text" id="totalSubscriptions">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card">
                        <div class="card-body">
                            <h5 class="card-title">活跃用户</h5>
                            <h3 class="card-text" id="activeUsers">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card">
                        <div class="card-body">
                            <h5 class="card-title">总节点数</h5>
                            <h3 class="card-text" id="totalNodes">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card">
                        <div class="card-body">
                            <h5 class="card-title">今日访问</h5>
                            <h3 class="card-text" id="todayVisits">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">最近订阅</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>用户名</th>
                                    <th>订阅链接</th>
                                    <th>创建时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="recentSubscriptions">
                                <!-- 动态加载数据 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                
                document.getElementById('totalSubscriptions').textContent = data.totalSubscriptions;
                document.getElementById('activeUsers').textContent = data.activeUsers;
                document.getElementById('totalNodes').textContent = data.totalNodes;
                document.getElementById('todayVisits').textContent = data.todayVisits;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // 加载最近订阅
        async function loadRecentSubscriptions() {
            try {
                const response = await fetch('/api/admin/recent-subscriptions');
                const data = await response.json();
                
                const tbody = document.getElementById('recentSubscriptions');
                tbody.innerHTML = data.map(sub => `
                    <tr>
                        <td>${sub.username}</td>
                        <td>${sub.subscription_url}</td>
                        <td>${new Date(sub.created_at).toLocaleString()}</td>
                        <td>
                            <span class="badge bg-${sub.status === 'active' ? 'success' : 'danger'}">
                                ${sub.status}
                            </span>
                        </td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-primary" onclick="viewSubscription(${sub.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="editSubscription(${sub.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSubscription(${sub.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading recent subscriptions:', error);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadRecentSubscriptions();
            setInterval(loadStats, 30000); // 每30秒更新一次统计数据
        });

        // 导航处理
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                e.target.classList.add('active');
                // 这里可以添加页面切换逻辑
            });
        });
    </script>
</body>
</html>
